name: QA

# DiemDesk quality gate — see docs/qa/qa-master-plan.md §6.
# Phase 1: typecheck + unit + prod build are the BLOCKING gate (no backend
# needed). E2E runs best-effort (uploads a report, doesn't block) until a
# backend/mock is wired into CI — the frontend calls a separate Express API that
# isn't present here, so backend-dependent journeys can't be gated yet.

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/qa.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/qa.yml']
  workflow_dispatch: {}

defaults:
  run:
    working-directory: frontend

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests (Vitest)
        run: npm run test:unit
      - name: Service-worker regression
        run: npm run test:sw
      - name: Production build
        run: npm run build
      - name: Cache the build for E2E
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: frontend/.next
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E (best-effort, chromium)
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true   # informational until a backend/mock lands in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Reuse the build from the quality job
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: frontend/.next
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E (chromium only)
        run: npx playwright test --project=chromium
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
