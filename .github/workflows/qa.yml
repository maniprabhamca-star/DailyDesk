name: QA

# DiemDesk quality gate — see docs/qa/qa-master-plan.md §6.
#
# Blocking: typecheck + unit + service-worker + production build.
# Blocking: E2E on chromium, mobile and webkit. None of them needs a backend —
#   every journey they cover runs on-device — so there is no excuse for any of
#   the three to be advisory. webkit is Safari, which is every iPhone; mobile is
#   the viewport most people actually arrive on.
# Advisory: firefox and edge, which catch engine differences (REG-015, the iOS
#   file-picker bug, is exactly this class). Both are green as of a1980ae and
#   should follow once they have been quiet for a fortnight.
#
# ⚠ An advisory job is INVISIBLE. Its failure does not reach the run conclusion,
# `gh run list`, the checks API, or the tick on a PR — all of which say success.
# mobile and webkit spent months red behind that, holding four real defects. If
# you make a job advisory, you are choosing not to be told; write down when you
# will look at it, or don't do it.

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', '.github/workflows/qa.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', '.github/workflows/qa.yml']
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test failure email, to prove the alerter is wired up'
        type: boolean
        default: false
  schedule:
    # Nightly full run: every browser, plus the throttled pass. Catches the
    # slow-device failures nobody reproduces on a laptop.
    - cron: '0 3 * * *'

defaults:
  run:
    working-directory: frontend

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backend had six test scripts and 150 assertions that nothing ever ran —
  # subscription refund windows, the checkout fallback chain, receipt parsing,
  # MCP token properties, budget validation, and the HTTP stack. They covered
  # money and credentials and were only ever run by hand, on one machine, when
  # somebody remembered. `backend/**` did not even trigger this workflow.
  #
  # None of them needs Postgres or Redis: the pure logic is separated from the
  # IO, and test-http-stack asserts the fail-open path that a missing Redis
  # produces. So there is no infrastructure excuse for leaving them out.
  backend:
    name: Backend suites + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # express + helmet + express-rate-limit sit under every request, and a
      # major in any of them changes behaviour without failing a build. This
      # boots the real app (which parses every route through path-to-regexp),
      # checks the security headers off a live response, proves the limiter
      # still limits — including that IPv6 addresses in one /56 share a bucket —
      # and that the Stripe webhook still gets byte-exact JSON it can verify.
      - name: HTTP stack (express / helmet / rate-limit / stripe webhook)
        run: npm run test:http-stack
      - name: Subscriptions — refund window + describe()
        run: npm run test:subs
      - name: Checkout fallbacks — every failure still ends in a URL
        run: npm run test:checkout
      - name: Receipt parsing
        run: npm run test:receipt
      - name: MCP connect tokens
        run: npm run test:mcp-token
      - name: Statement page quota
        run: npm run test:quota
      - name: Budget receipt detail
        run: npm run test:budget-detail
      # The frontend has scripts/audit-gate.mjs; the backend had nothing, so a
      # high advisory in express or stripe could be merged without a word.
      # Shipping deps only — a dev-only advisory never reaches a user, and
      # failing on one teaches people to skip the step.
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  quality:
    name: Typecheck + unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests (Vitest)
        run: npm run test:unit
      - name: Service-worker regression
        run: npm run test:sw
      # The sector pages promise three things in lib/sectors.ts's own type
      # comments that nothing enforced: title <= 60 chars, description <= 155,
      # and toolkit/job names that match catalog.tsx EXACTLY. A curated tool
      # list is only useful if it actually opens the tool, and a typo in a
      # name produces a card that silently goes nowhere — a build and a full
      # unit run stay green through it. This checks every sector, every name
      # and every href, including that the route has a real page.tsx.
      - name: Sector data contract
        run: npm run verify:sectors
      # This build exists to be tested, not shipped, and the E2E jobs serve it
      # over http on localhost. DD_ALLOW_PLAIN_HTTP drops `upgrade-insecure-
      # requests` from the CSP for it — WebKit applies that directive to
      # localhost where Chromium does not, which upgraded every asset URL to
      # https, failed all of them, and left webkit testing a page on which no
      # JavaScript had run. tests/unit/csp.test.ts (run above) is what keeps the
      # directive in a real production build.
      - name: Production build
        run: npm run build
        env:
          DD_ALLOW_PLAIN_HTTP: '1'
      # Fails the build on a HIGH or CRITICAL advisory in anything that actually
      # ships. Dependabot opens the PR; this is what stops one being merged past.
      # Dev-only advisories are excluded deliberately — they never reach a user,
      # and failing on them trains people to ignore this step.
      - name: Dependency audit (production deps)
        run: npm run audit:gate
      - name: Cache the build for E2E
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: frontend/.next
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E — ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: quality
    # chromium, mobile and webkit all block. firefox and edge still only report.
    #
    # mobile and webkit were advisory from the start, on the theory that engine
    # differences flake on the runner. What actually happened is that they went
    # red and stayed red — three real mobile defects and a CSP bug that had
    # killed Print in Safari on production — while this workflow reported
    # success on every single run, because the run's conclusion is the only
    # thing gh, the checks API and the green tick on a PR ever show. Nobody
    # ignored a warning; there was no warning to ignore.
    #
    # They are green on a1980ae, so they block from here. A blocking job that
    # flakes gets fixed or gets its test quarantined; an advisory job that fails
    # gets nothing, which is how months of real bugs went unread.
    continue-on-error: ${{ matrix.project == 'firefox' || matrix.project == 'edge' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile, edge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Reuse the build from the quality job
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: frontend/.next
      - name: Generate the service worker (lives in public/, not in .next)
        run: npm run sw
      - name: Install the browser for this project
        # 'mobile' is Chromium device-emulation, and 'edge' installs under the
        # channel name 'msedge' — neither project name is a valid install target.
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile' && 'chromium' || matrix.project == 'edge' && 'msedge' || matrix.project }}
      - name: Run E2E
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report
          retention-days: 7

  # ── Tell somebody. ──────────────────────────────────────────────────────────
  #
  # On 2026-11-14 and again on 2026-11-15 the nightly run went red because the
  # audit gate had found a CRITICAL advisory in `next` that was live on
  # production. The gate worked exactly as designed, both times. Nobody found
  # out for nearly three days, because a scheduled run's conclusion is visible
  # only to whoever goes and reads it, and there is no reason for anyone to go
  # and read a thing that is green most mornings.
  #
  # Detection was never the gap. Delivery was. The same reasoning as the
  # `continue-on-error` note at the top of this file: a result nobody receives
  # is a result nobody has.
  #
  # Scheduled runs and pushes to main only — those are the ones with nobody
  # watching. A pull request already shows its own red tick to the person who
  # opened it.
  notify:
    name: Tell the owner it failed
    runs-on: ubuntu-latest
    needs: [backend, quality, e2e]
    if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # One package, pinned, rather than a third-party marketplace action: this
      # step is handed the mail password, and the fewer people that is true of
      # the better. nodemailer is already what the backend sends mail with.
      - name: Install the mailer
        working-directory: .github/scripts
        run: npm install --no-save --no-package-lock nodemailer@10.5.0
      - name: Send the alert
        working-directory: .github/scripts
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DD_EVENT: ${{ github.event_name }}
          # The whole needs context, so the email can name the job that went red
          # instead of saying only that something did.
          DD_FAILED: ${{ toJSON(needs) }}
        run: node notify-failure.mjs

  # Prove the alerter, on demand.
  #
  # A notifier nobody has ever seen fire is a hypothesis, not a safety net —
  # the same reason the backup script reads its own dump back instead of
  # trusting that pg_dump wrote one. Actions → QA → Run workflow → tick "Send a
  # test failure email".
  #
  # No `needs`, deliberately: this tests DELIVERY, and nothing about the test
  # suite's result changes whether an email can be sent. Waiting twenty minutes
  # for an answer it does not use is how a check stops being run.
  notify-test:
    name: Test the failure alert
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the mailer
        working-directory: .github/scripts
        run: npm install --no-save --no-package-lock nodemailer@10.5.0
      - name: Send a test alert
        working-directory: .github/scripts
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DD_EVENT: ${{ github.event_name }}
          DD_TEST: '1'
          DD_FAILED: '{"quality":{"result":"failure"}}'
        run: node notify-failure.mjs

  throttled:
    name: E2E — slow device (nightly)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: frontend/.next
      - run: npm run sw
      - run: npx playwright install --with-deps chromium
      - name: Slow-3G + 4× CPU
        run: npx playwright test --project=chromium-slow
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-slow
          path: frontend/playwright-report
          retention-days: 7
