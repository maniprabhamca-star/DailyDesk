name: QA

# DiemDesk quality gate — see docs/qa/qa-master-plan.md §6.
#
# Blocking: typecheck + unit + service-worker + production build.
# Blocking: E2E on chromium, mobile and webkit. None of them needs a backend —
#   every journey they cover runs on-device — so there is no excuse for any of
#   the three to be advisory. webkit is Safari, which is every iPhone; mobile is
#   the viewport most people actually arrive on.
# Advisory: firefox and edge, which catch engine differences (REG-015, the iOS
#   file-picker bug, is exactly this class). Both are green as of a1980ae and
#   should follow once they have been quiet for a fortnight.
#
# ⚠ An advisory job is INVISIBLE. Its failure does not reach the run conclusion,
# `gh run list`, the checks API, or the tick on a PR — all of which say success.
# mobile and webkit spent months red behind that, holding four real defects. If
# you make a job advisory, you are choosing not to be told; write down when you
# will look at it, or don't do it.

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/qa.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/qa.yml']
  workflow_dispatch: {}
  schedule:
    # Nightly full run: every browser, plus the throttled pass. Catches the
    # slow-device failures nobody reproduces on a laptop.
    - cron: '0 3 * * *'

defaults:
  run:
    working-directory: frontend

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests (Vitest)
        run: npm run test:unit
      - name: Service-worker regression
        run: npm run test:sw
      # This build exists to be tested, not shipped, and the E2E jobs serve it
      # over http on localhost. DD_ALLOW_PLAIN_HTTP drops `upgrade-insecure-
      # requests` from the CSP for it — WebKit applies that directive to
      # localhost where Chromium does not, which upgraded every asset URL to
      # https, failed all of them, and left webkit testing a page on which no
      # JavaScript had run. tests/unit/csp.test.ts (run above) is what keeps the
      # directive in a real production build.
      - name: Production build
        run: npm run build
        env:
          DD_ALLOW_PLAIN_HTTP: '1'
      # Fails the build on a HIGH or CRITICAL advisory in anything that actually
      # ships. Dependabot opens the PR; this is what stops one being merged past.
      # Dev-only advisories are excluded deliberately — they never reach a user,
      # and failing on them trains people to ignore this step.
      - name: Dependency audit (production deps)
        run: npm run audit:gate
      - name: Cache the build for E2E
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: frontend/.next
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E — ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: quality
    # chromium, mobile and webkit all block. firefox and edge still only report.
    #
    # mobile and webkit were advisory from the start, on the theory that engine
    # differences flake on the runner. What actually happened is that they went
    # red and stayed red — three real mobile defects and a CSP bug that had
    # killed Print in Safari on production — while this workflow reported
    # success on every single run, because the run's conclusion is the only
    # thing gh, the checks API and the green tick on a PR ever show. Nobody
    # ignored a warning; there was no warning to ignore.
    #
    # They are green on a1980ae, so they block from here. A blocking job that
    # flakes gets fixed or gets its test quarantined; an advisory job that fails
    # gets nothing, which is how months of real bugs went unread.
    continue-on-error: ${{ matrix.project == 'firefox' || matrix.project == 'edge' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile, edge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Reuse the build from the quality job
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: frontend/.next
      - name: Generate the service worker (lives in public/, not in .next)
        run: npm run sw
      - name: Install the browser for this project
        # 'mobile' is Chromium device-emulation, and 'edge' installs under the
        # channel name 'msedge' — neither project name is a valid install target.
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile' && 'chromium' || matrix.project == 'edge' && 'msedge' || matrix.project }}
      - name: Run E2E
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report
          retention-days: 7

  throttled:
    name: E2E — slow device (nightly)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: frontend/.next
      - run: npm run sw
      - run: npx playwright install --with-deps chromium
      - name: Slow-3G + 4× CPU
        run: npx playwright test --project=chromium-slow
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-slow
          path: frontend/playwright-report
          retention-days: 7
