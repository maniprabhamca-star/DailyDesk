# Dependency updates, opened as pull requests automatically.
#
# ⚠ The FIRST version of this file was wrong, and the mistake is worth keeping
# written down. It grouped only minor and patch updates, so every major bump
# arrived as its own pull request — twenty of them within the hour, because the
# project had drifted a long way (typescript 5→7, tailwind 3→4, eslint 8→10,
# uuid 10→14). Twenty-two open PRs is not monitoring, it is noise, and noise is
# what gets a bot muted.
#
# Worse, "no outdated dependencies, strictly" is about SECURITY, and Dependabot
# security updates were switched off at the repository level the whole time. So
# the first config delivered maximum noise and zero protection. Security updates
# are now enabled in repo settings — they are a SEPARATE mechanism that does not
# read this file, which is exactly why ignoring majors here is safe.
#
# The split this file now makes:
#   security   → repo settings, immediate, unaffected by anything below
#   minor/patch → one grouped PR a week, per project
#   major       → ignored, because a major is a migration and belongs in a
#                 planned piece of work, not a PR that fails CI until someone
#                 closes it
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, frontend]
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, backend]
    groups:
      backend:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, mcp]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # Pinned actions go stale too, and a compromised action is a supply-chain
  # problem rather than a dependency one. Grouped, so it is one PR not four.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [ci]
    groups:
      actions:
        patterns: ['*']
